<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7efe8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="音庭" />
    <title>音庭 — 音の種を育てよう</title>
    <meta name="description" content="音の種を置くだけで、小さな曲が育つ音楽の箱庭。" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">♪</span>
          <div>
            <h1>音庭</h1>
            <p>音の種を置いて、ちいさな景色を育てよう</p>
          </div>
        </div>

        <div class="transport" aria-label="再生操作">
          <button id="playButton" class="control primary" type="button" aria-pressed="false">
            <span aria-hidden="true">▶</span><span>再生</span>
          </button>
          <button id="stopButton" class="control" type="button">
            <span aria-hidden="true">■</span><span>停止</span>
          </button>
          <button id="recordButton" class="control record" type="button" aria-label="録音" aria-pressed="false">
            <span class="record-dot" aria-hidden="true"></span><span>録音</span>
          </button>
          <button id="clearButton" class="control ghost" type="button">
            <span aria-hidden="true">↺</span><span>全部消す</span>
          </button>
        </div>
      </header>

      <section class="workspace" aria-label="音庭の作曲エリア">
        <aside class="seed-tray" aria-label="音の種">
          <div class="tray-heading">
            <span>音の種</span>
            <small>つまんで置こう</small>
          </div>

          <div class="seed-list">
            <button class="seed-card sparkle" type="button" data-seed="sparkle" draggable="true" aria-label="きらきらの種。お庭へドラッグ">
              <span class="seed-icon">✨</span>
              <span class="seed-copy"><strong>きらきら</strong><small>澄んだ高い音</small></span>
              <span class="drag-grip" aria-hidden="true">⠿</span>
            </button>
            <button class="seed-card fluffy" type="button" data-seed="fluffy" draggable="true" aria-label="ふわふわの種。お庭へドラッグ">
              <span class="seed-icon">🌱</span>
              <span class="seed-copy"><strong>ふわふわ</strong><small>やさしい空気</small></span>
              <span class="drag-grip" aria-hidden="true">⠿</span>
            </button>
            <button class="seed-card bubbly" type="button" data-seed="bubbly" draggable="true" aria-label="ぽこぽこの種。お庭へドラッグ">
              <span class="seed-icon">💧</span>
              <span class="seed-copy"><strong>ぽこぽこ</strong><small>はずむリズム</small></span>
              <span class="drag-grip" aria-hidden="true">⠿</span>
            </button>
            <button class="seed-card grainy" type="button" data-seed="grainy" draggable="true" aria-label="ざらざらの種。お庭へドラッグ">
              <span class="seed-icon">🖤</span>
              <span class="seed-copy"><strong>ざらざら</strong><small>深い低い音</small></span>
              <span class="drag-grip" aria-hidden="true">⠿</span>
            </button>
            <button class="seed-card drizzle" type="button" data-seed="drizzle" draggable="true" aria-label="しとしとの種。お庭へドラッグ">
              <span class="seed-icon">🌧️</span>
              <span class="seed-copy"><strong>しとしと</strong><small>雨と小川の音</small></span>
              <span class="drag-grip" aria-hidden="true">⠿</span>
            </button>
            <button class="seed-card breeze" type="button" data-seed="breeze" draggable="true" aria-label="そよそよの種。お庭へドラッグ">
              <span class="seed-icon">🍃</span>
              <span class="seed-copy"><strong>そよそよ</strong><small>風と息の音</small></span>
              <span class="drag-grip" aria-hidden="true">⠿</span>
            </button>
            <button class="seed-card wood" type="button" data-seed="wood" draggable="true" aria-label="こつこつの種。お庭へドラッグ">
              <span class="seed-icon">🌳</span>
              <span class="seed-copy"><strong>こつこつ</strong><small>木と枝の音</small></span>
              <span class="drag-grip" aria-hidden="true">⠿</span>
            </button>
            <button class="seed-card bird" type="button" data-seed="bird" draggable="true" aria-label="ぴるぴるの種。お庭へドラッグ">
              <span class="seed-icon">🐦</span>
              <span class="seed-copy"><strong>ぴるぴる</strong><small>小鳥と笛の音</small></span>
              <span class="drag-grip" aria-hidden="true">⠿</span>
            </button>
          </div>

          <div class="tempo-control">
            <div class="tempo-heading">
              <label for="bpmSlider">成長速度</label>
              <output id="bpmValue" for="bpmSlider">84 BPM</output>
            </div>
            <div class="tempo-slider-row">
              <span aria-hidden="true">ゆっくり</span>
              <input id="bpmSlider" type="range" min="50" max="160" step="2" value="84" aria-valuetext="ふつう 84 BPM" />
              <span aria-hidden="true">はやい</span>
            </div>
          </div>
        </aside>

        <div class="garden-wrap">
          <div class="garden-toolbar" aria-label="お庭の移動と再生位置">
            <div class="listen-from" role="group" aria-label="どこから聴くか">
              <button id="listenFromStart" class="path-button" type="button">はじめから聴く</button>
              <button id="listenFromHere" class="path-button active" type="button">ここから聴く</button>
            </div>
            <div class="garden-actions">
              <button id="unlockSectionButton" class="path-button warm" type="button" hidden>この庭にも手を加える</button>
              <button id="extendGardenButton" class="path-button grow" type="button"><span aria-hidden="true">🌱</span> 庭をのばす</button>
            </div>
          </div>

          <div id="garden" class="garden" role="application" aria-label="横へ続く音のお庭。上ほど高い音、右ほど後に鳴ります">
            <div id="gardenTrack" class="garden-track"></div>
            <div id="playhead" class="playhead" aria-hidden="true"></div>
            <div id="suggestionGlow" class="suggestion-glow" aria-hidden="true" hidden></div>

            <button id="fairyButton" class="resident fairy" type="button" aria-label="妖精さんに相談する" aria-haspopup="dialog" aria-expanded="false">
              <span class="resident-icon" aria-hidden="true">🧚</span>
              <span class="resident-caption">妖精さん</span>
            </button>
            <button id="gnomeButton" class="resident gnome" type="button" aria-label="こびとさんに相談する" aria-haspopup="dialog" aria-expanded="false">
              <span class="resident-icon" aria-hidden="true">🧑‍🌾</span>
              <span class="resident-caption">こびとさん</span>
            </button>

            <section id="residentBubble" class="resident-bubble" role="dialog" aria-labelledby="residentBubbleName" aria-describedby="residentBubbleMessage" hidden>
              <div class="resident-bubble-heading">
                <span id="residentBubbleIcon" class="bubble-icon" aria-hidden="true">🧚</span>
                <strong id="residentBubbleName">妖精さん</strong>
              </div>
              <p id="residentBubbleMessage"></p>
              <div id="residentActions" class="resident-actions"></div>
            </section>

          </div>

          <div id="seedBasket" class="seed-basket" aria-hidden="true">
            <div id="seedPendingBar" class="seed-pending-bar" hidden>
              <button id="seedPendingDisplay" class="seed-pending-display" type="button" aria-label="種を変える"></button>
              <button id="seedPendingCancel" class="seed-pending-cancel" type="button" aria-label="種まきをやめる">×</button>
            </div>
            <button id="seedBasketBtn" class="seed-basket-btn" type="button" aria-label="種かごを開く" aria-expanded="false">
              <span aria-hidden="true">🌱</span><span>種かご</span>
            </button>
            <div id="seedBasketPanel" class="seed-basket-panel" hidden role="group" aria-label="音の種を選ぼう">
              <button class="basket-panel-seed sparkle" type="button" data-seed="sparkle" aria-label="きらきら"><span class="bp-icon">✨</span><span class="bp-label">きらきら</span></button>
              <button class="basket-panel-seed fluffy"  type="button" data-seed="fluffy"  aria-label="ふわふわ"><span class="bp-icon">🌱</span><span class="bp-label">ふわふわ</span></button>
              <button class="basket-panel-seed bubbly"  type="button" data-seed="bubbly"  aria-label="ぽこぽこ"><span class="bp-icon">💧</span><span class="bp-label">ぽこぽこ</span></button>
              <button class="basket-panel-seed grainy"  type="button" data-seed="grainy"  aria-label="ざらざら"><span class="bp-icon">🖤</span><span class="bp-label">ざらざら</span></button>
              <button class="basket-panel-seed drizzle" type="button" data-seed="drizzle" aria-label="しとしと"><span class="bp-icon">🌧️</span><span class="bp-label">しとしと</span></button>
              <button class="basket-panel-seed breeze"  type="button" data-seed="breeze"  aria-label="そよそよ"><span class="bp-icon">🍃</span><span class="bp-label">そよそよ</span></button>
              <button class="basket-panel-seed wood"    type="button" data-seed="wood"    aria-label="こつこつ"><span class="bp-icon">🌳</span><span class="bp-label">こつこつ</span></button>
              <button class="basket-panel-seed bird"    type="button" data-seed="bird"    aria-label="ぴるぴる"><span class="bp-icon">🐦</span><span class="bp-label">ぴるぴる</span></button>
            </div>
          </div>

          <nav id="gardenMap" class="garden-map" aria-label="お庭の現在位置"></nav>

          <details class="relay-panel">
            <summary><span aria-hidden="true">🎒</span> 音のバトン</summary>
            <div class="relay-content">
              <label class="gardener-name">庭師さんの名前 <input id="gardenerName" maxlength="30" placeholder="書かなくても大丈夫" autocomplete="nickname" /></label>
              <div class="relay-actions">
                <button id="passBatonButton" class="relay-button primary" type="button">音のバトンを渡す</button>
                <label class="relay-button file-button">続きを育てる<input id="receiveBatonInput" type="file" accept="application/json,.json" /></label>
              </div>
              <p class="relay-help">受け取ったお庭は大切に残り、最後に新しい区画がひらきます。名前以外の個人情報は入りません。</p>
              <details class="relay-history"><summary>リレーの記録を見る</summary><ol id="relayHistoryList"></ol></details>
            </div>
          </details>

          <div class="garden-note">
            <span><i class="move-dot" aria-hidden="true"></i>置いた種は動かせる</span>
            <span><i class="grow-dot" aria-hidden="true"></i>ぽんっと押すと大きくなる</span>
            <span><i class="tuplet-dot" aria-hidden="true"></i>ぴったり重ねると連符</span>
            <span><i class="pluck-dot" aria-hidden="true"></i>長押しで摘み取る</span>
          </div>

          <section id="recordingPanel" class="recording-panel" aria-label="録音した音庭" hidden>
            <div class="recording-copy">
              <span class="recording-icon" aria-hidden="true">♫</span>
              <div><strong>曲の種ができたよ</strong><small>マイクは使わず、音庭の音だけを録音しました</small></div>
            </div>
            <audio id="recordingAudio" controls preload="metadata"></audio>
            <div class="recording-actions">
              <a id="downloadRecording" class="recording-action primary" href="#" download>端末に保存</a>
              <button id="shareRecording" class="recording-action" type="button" hidden>共有</button>
              <button id="discardRecording" class="recording-action quiet" type="button">録音を消す</button>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div id="batonScene" class="baton-scene" role="status" aria-live="polite" hidden>
      <button id="skipBatonScene" type="button">スキップ</button>
      <div class="baton-bag" aria-hidden="true">🎒<span>✨</span></div>
      <strong id="batonSceneMessage">音の種を大切に包んでいるよ…</strong>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
